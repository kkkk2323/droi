name: PR

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request's branch cancels the run it replaces;
# main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suites run side by side.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

  # Formatting, vetting and the Linux builds of the native app read the code
  # only: Ubuntu does them while the macOS runners run the tests. Vet each
  # GOOS the app ships for, as its files differ between them.
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - name: Format
        run: |
          gofmt="$(go env GOROOT)/bin/gofmt"
          unformatted="$("$gofmt" -l apps/native)"
          test -z "$unformatted" || { echo "$unformatted"; echo "::error::Not formatted: run \"$(go env GOROOT)/bin/gofmt\" -w apps/native (a gofmt from another Go formats differently)"; exit 1; }

      - name: Vet
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./apps/native/...
          GOOS=windows CGO_ENABLED=0 go vet ./apps/native/...
          GOOS=linux CGO_ENABLED=0 go vet ./apps/native/...

      - name: Build for Linux
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./apps/native
          done

  # The view tests run App.View against the Fake Daemon, which needs Node, and
  # draw a scenario's Sessions from a Fake Kernel beside it, which needs the
  # host Kernel; only macOS draws a frame as a Release does. They take most of
  # the run, so two shards split them, each in a runner of its own: shards of
  # one runner only queue behind each other, as each draws its frames on that
  # runner's one GPU. The same tests also run on one CPU, where one that races
  # the Fake Daemon's answers fails, not in a Release.
  native:
    name: native (${{ matrix.run.name }}, shard ${{ matrix.shard }} of 2)
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      # Every shard must report, whichever goes first.
      fail-fast: false
      matrix:
        run:
          - name: view tests
            args: ''
          - name: view tests on one CPU
            args: -test.cpu=1
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: pnpm/action-setup@v6

      - uses: actions/cache@v4
        with:
          path: apps/native/assets/kernel
          key: kernel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/kernel/src/**', 'packages/**') }}

      - name: Build the host Kernel for the Fake Kernel
        run: |
          pnpm install --frozen-lockfile
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) platform=darwin-arm64 ;;
            Darwin-x86_64) platform=darwin-x64 ;;
            *) echo "::error::unsupported host: $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          (cd apps/kernel && bun run build.ts "$platform")

      - name: Build the view tests
        run: go test -c -o "$RUNNER_TEMP/app.test" ./apps/native/internal/app

      - name: Run this shard of the view tests
        working-directory: apps/native/internal/app
        env:
          ARGS: ${{ matrix.run.args }}
          SHARD: ${{ matrix.shard }}
          DROI_FAKEKERNEL_REQUIRED: '1'
        run: |
          tests="$("$RUNNER_TEMP/app.test" -test.list '^Test')"
          test -n "$tests" || { echo "::error::no view test was listed"; exit 1; }
          # A name the pattern would read as a regex is refused rather than
          # silently matched to nothing.
          odd="$(printf '%s\n' "$tests" | grep -vxE '[A-Za-z0-9_]+' || true)"
          test -z "$odd" || { echo "::error::unexpected test names: $odd"; exit 1; }
          pattern="$(printf '%s\n' "$tests" | awk -v shard="$SHARD" -v of=2 'NR % of == shard - 1 { b = b (b ? "|" : "") $0 } END { print "^(" b ")$" }')"
          count="$(printf '%s\n' "$pattern" | tr '|' '\n' | wc -l | tr -d ' ')"
          echo "shard $SHARD of 2: $count tests"
          "$RUNNER_TEMP/app.test" -test.timeout 10m $ARGS -test.run "$pattern"

  # Every other package's tests: they need Node too, where one starts the Fake
  # Daemon itself, so they stay on macOS beside the view tests.
  native-packages:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      # The Fake Kernel starts a real Kernel binary, so this job builds the host one. Without it the
      # package's tests skip, and a package whose tests all skip is a package with no tests.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: pnpm/action-setup@v6

      - uses: actions/cache@v4
        with:
          path: apps/native/assets/kernel
          key: kernel-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'apps/kernel/src/**', 'packages/**') }}

      - name: Build the host Kernel for the Fake Kernel tests
        run: |
          pnpm install --frozen-lockfile
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) platform=darwin-arm64 ;;
            Darwin-x86_64) platform=darwin-x64 ;;
            *) echo "::error::unsupported host: $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          (cd apps/kernel && bun run build.ts "$platform")

      - name: The other packages' tests
        env:
          DROI_FAKEKERNEL_REQUIRED: '1'
        run: go test $(go list ./apps/native/... | grep -v '/internal/app$')

  # Droi's droid and its Key Hook, the Key Pool and its LLM Proxy on Windows,
  # where paths, file locks and process signals differ (ADR 0033).
  key-pool-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - run: go test ./apps/native/pkg/droidhook/... ./apps/native/pkg/keypool ./apps/native/pkg/llmproxy/... ./apps/native/internal/llmusage

      - run: go test ./apps/native/pkg/host -run 'TestTheDaemonSeesItsAnchorGo|TestTheDaemonAnchorEndsWhenItsInputCloses'

  phone-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Chromium is a download of its own, so keep it until Playwright's version
      # changes; on a hit only its system packages are needed. apt stalls on a
      # slow mirror now and then, which a retry rides out.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium with its system packages
        run: |
          sudo sh -c 'echo "Acquire::Retries \"5\";" > /etc/apt/apt.conf.d/99retries'
          pnpm -C tests exec playwright install --with-deps chromium

      - name: Phone App web build against the Fake Daemon
        run: pnpm test:e2e:phone

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-phone
          path: tests/test-results
          retention-days: 7

  # The kernel: its own tests under Bun (they open real SQLite files and a faux model), then a
  # cross-compiled binary that must still process an image. `bun build --compile` keeps Photon's
  # WebAssembly but used to lose the way to it in a cross build, so a native build is no evidence:
  # this job builds for Linux and Windows from Ubuntu, runs the Linux one, and hands the Windows one
  # to `kernel-windows` to run on a real Windows runner.
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Kernel tests
        run: pnpm test:kernel

      - name: Build the kernel for Linux and Windows, staged as a release stages it
        run: |
          cd apps/kernel
          bun run build.ts --stage linux-x64 windows-x64

      - name: The cross-compiled Linux binary still reads an image
        working-directory: apps/kernel
        run: bun run smoke.ts "$GITHUB_WORKSPACE/apps/native/resources/linux-amd64/kernel"

      - uses: actions/upload-artifact@v7
        with:
          name: kernel-windows
          path: apps/native/assets/kernel/windows-x64/
          retention-days: 3

  # The Windows binary above was cross-compiled on Ubuntu. Run it on Windows and make it read a PNG:
  # the whole point is that this combination, and only this one, was broken before.
  kernel-windows:
    needs: kernel
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@v7
        with:
          name: kernel-windows
          path: kernel-windows

      - name: The cross-compiled Windows binary still reads an image
        working-directory: apps/kernel
        run: bun run smoke.ts "${{ github.workspace }}/kernel-windows/kernel.exe"

      - name: The Windows tool layer chooses PowerShell, not WSL
        run: pnpm -C apps/kernel exec bun test test/platform.test.ts
