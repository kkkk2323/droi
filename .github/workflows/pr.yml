name: PR

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request's branch cancels the run it replaces;
# main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suites run side by side.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

  # The native app: its view tests run against the Fake Daemon, which
  # droid-sdk-go's fakedaemon package runs in Node.
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - name: Go checks
        run: |
          gofmt="$(go env GOROOT)/bin/gofmt"
          test -z "$("$gofmt" -l apps/native)" || { "$gofmt" -l apps/native; echo "::error::Not formatted: run \"\$(go env GOROOT)/bin/gofmt\" -w apps/native (a gofmt from another Go formats differently)"; exit 1; }
          go vet ./apps/native/...
          GOOS=windows go vet ./apps/native/...
          GOOS=linux CGO_ENABLED=0 go vet ./apps/native/...
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./apps/native
          done
          go test ./apps/native/...
          # On one CPU, a view test that races the Fake Daemon's answers fails here, not in a Release.
          go test -cpu 1 ./apps/native/internal/app

  # The Patched Droid's patcher, the Key Pool and its LLM Proxy on Windows,
  # where paths, file locks and process signals differ (ADR 0027).
  key-pool-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - run: go test ./apps/native/pkg/droidpatch/... ./apps/native/pkg/keypool ./apps/native/pkg/llmproxy/... ./apps/native/internal/llmusage

  phone-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C tests exec playwright install --with-deps chromium

      - name: Phone App web build against the Fake Daemon
        run: pnpm test:e2e:phone

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-phone
          path: tests/test-results
          retention-days: 7
