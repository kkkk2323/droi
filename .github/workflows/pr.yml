name: PR

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request's branch cancels the run it replaces;
# main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suites run side by side.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

  # The native app: its view tests run against the Fake Daemon, which the
  # workspace's esbuild bundles, so the workspace is installed too.
  native:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/native/go.mod

      - run: pnpm install --frozen-lockfile

      - name: Go checks
        run: |
          test -z "$(gofmt -l apps/native packages/droid-sdk-go)" || { gofmt -l apps/native packages/droid-sdk-go; exit 1; }
          go vet ./apps/native/... ./packages/droid-sdk-go/...
          GOOS=windows go vet ./apps/native/... ./packages/droid-sdk-go/...
          go test ./apps/native/... ./packages/droid-sdk-go/...

  phone-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C tests exec playwright install --with-deps chromium

      - name: Phone App web build against the Fake Daemon
        run: pnpm test:e2e:phone

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-phone
          path: tests/test-results
          retention-days: 7

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # Electron brings its own Chromium; it only needs the system libraries.
      - run: pnpm -C tests exec playwright install-deps chromium

      - run: pnpm build

      - name: Desktop Shell smoke suite
        run: xvfb-run -a pnpm test:smoke

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-smoke
          path: tests/test-results
          retention-days: 7
