name: PR

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request's branch cancels the run it replaces;
# main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The suites run side by side.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm test

  # Formatting, vetting and the Linux builds of the native app read the code
  # only: Ubuntu does them while the macOS runners run the tests. Vet each
  # GOOS the app ships for, as its files differ between them.
  go-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - name: Format
        run: |
          gofmt="$(go env GOROOT)/bin/gofmt"
          unformatted="$("$gofmt" -l apps/native)"
          test -z "$unformatted" || { echo "$unformatted"; echo "::error::Not formatted: run \"$(go env GOROOT)/bin/gofmt\" -w apps/native (a gofmt from another Go formats differently)"; exit 1; }

      - name: Vet
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./apps/native/...
          GOOS=windows CGO_ENABLED=0 go vet ./apps/native/...
          GOOS=linux CGO_ENABLED=0 go vet ./apps/native/...

      - name: Build for Linux
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -o /dev/null ./apps/native
          done

  # The view tests run App.View against the Fake Daemon, which needs Node, and
  # only macOS draws a frame as a Release does. A run takes minutes, so the
  # tests run in shards: batches of the names `-test.list` prints, each in an
  # invocation of its own with its own Fake Daemon and temporary folders, so
  # they share nothing. The same tests run as a Release does, and again on one
  # CPU, where a view test that races the Fake Daemon's answers fails, not in
  # a Release: the two runs are jobs of their own, side by side.
  native:
    name: native (${{ matrix.name }})
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      # Both runs must report, whichever goes first.
      fail-fast: false
      matrix:
        include:
          - name: view tests
            args: ''
          - name: view tests on one CPU
            args: -test.cpu=1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - name: Build the view tests
        run: go test -c -o "$RUNNER_TEMP/app.test" ./apps/native/internal/app

      - name: Run the view tests in shards
        working-directory: apps/native/internal/app
        env:
          ARGS: ${{ matrix.args }}
        run: |
          # One shard a core, and no more than four: past that they only
          # fight over the cores.
          shards="$(getconf _NPROCESSORS_ONLN)"
          test "$shards" -le 4 || shards=4
          echo "shards at once: $shards"
          tests="$("$RUNNER_TEMP/app.test" -test.list '^Test')"
          test -n "$tests" || { echo "::error::no view test was listed"; exit 1; }
          # A name the batch's pattern would read as a regex is refused rather
          # than silently matched to nothing.
          odd="$(printf '%s\n' "$tests" | grep -vxE '[A-Za-z0-9_]+' || true)"
          test -z "$odd" || { echo "::error::unexpected test names: $odd"; exit 1; }
          printf '%s\n' "$tests" | awk '
            { batch = batch (batch ? "|" : "") $0; if (++n % 8 == 0) { print "^(" batch ")$"; batch = "" } }
            END { if (batch) print "^(" batch ")$" }
          ' | xargs -n 1 -P "$shards" "$RUNNER_TEMP/app.test" -test.timeout 10m $ARGS

  # Every other package's tests: they need Node too, where one starts the Fake
  # Daemon itself, so they stay on macOS beside the view tests.
  native-packages:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - name: The other packages' tests
        run: go test $(go list ./apps/native/... | grep -v '/internal/app$')

  # Droi's droid and its Key Hook, the Key Pool and its LLM Proxy on Windows,
  # where paths, file locks and process signals differ (ADR 0033).
  key-pool-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/native/go.mod
          cache-dependency-path: apps/native/go.sum

      - run: go test ./apps/native/pkg/droidhook/... ./apps/native/pkg/keypool ./apps/native/pkg/llmproxy/... ./apps/native/internal/llmusage

      - run: go test ./apps/native/pkg/host -run 'TestTheDaemonSeesItsAnchorGo|TestTheDaemonAnchorEndsWhenItsInputCloses'

  phone-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm -C tests exec playwright install --with-deps chromium

      - name: Phone App web build against the Fake Daemon
        run: pnpm test:e2e:phone

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-phone
          path: tests/test-results
          retention-days: 7
