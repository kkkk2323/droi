name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# One Release holds Droi, the native app (apps/native): its disk image, its
# Windows installer, and their signed updates for the app to install itself. It also holds a last code update
# for the Electron Desktop Shell, which those still on it install on their own:
# it finds the native app's manifest and asks them to download it.
jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm typecheck && pnpm test

      # - name: Droid CLI compatibility gate
      #   env:
      #     FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
      #     FACTORY_DROID_CLI_VERSION: 0.57.14
      #     FACTORY_MODEL_ID: minimax-m2.5
      #   run: pnpm test:compat
      #   timeout-minutes: 15

  # The view tests run against the Fake Daemon, which the workspace's esbuild bundles.
  validate-native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/native/go.mod

      - run: pnpm install --frozen-lockfile

      - run: go vet ./apps/native/... && go test ./apps/native/...

  # The builds upload to a draft, which the last job publishes once all are in.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            /^## / {
              if (in_section) exit
              header = "## " version
              if ($0 == header || index($0, header " ") == 1) in_section = 1
              next
            }
            in_section { print }
          ' CHANGELOG.md > notes.md
          cat >> notes.md <<'EOF'

          **Note:** The app is not signed with an Apple Developer certificate. If macOS blocks the app, run:
          ```bash
          xattr -cr /Applications/Droi.app
          ```

          On Windows the installer is not code-signed either: if SmartScreen stops it, choose **More info → Run anyway**.
          EOF
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi

  build-native:
    needs: draft
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/native/go.mod

      - name: Check the version
        run: |
          VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' mygo.json)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::mygo.json is $VERSION, the tag $GITHUB_REF_NAME"
            exit 1
          fi

      # One app for both chips, so one update manifest, the one the Electron
      # Shell looks for (update-darwin-universal.json).
      - name: Build, sign the update and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::the MYGO_UPDATER_PRIVATE_KEY secret is missing"
            exit 1
          fi
          go tool mygo build -platform darwin/universal -upload

  # MyGo needs no cgo, so Ubuntu builds the Windows app; NSIS makes its installer.
  build-native-windows:
    needs: draft
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/native/go.mod

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build, sign the update and upload
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
        run: |
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "::error::the MYGO_UPDATER_PRIVATE_KEY secret is missing"
            exit 1
          fi
          go tool mygo build -platform windows/amd64 -upload

  build-asar:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Package app (--dir, no DMG)
        run: pnpm -C apps/desktop exec electron-builder --mac --arm64 --dir --publish never

      - name: Generate ASAR artifact
        run: |
          ASAR_PATH=$(find apps/desktop/dist -path '*/Contents/Resources/app.asar' | head -1)
          if [ -z "$ASAR_PATH" ]; then
            echo "::error::app.asar not found"
            exit 1
          fi
          gzip -c "$ASAR_PATH" > apps/desktop/dist/app.asar.gz
          SHA=$(shasum -a 256 apps/desktop/dist/app.asar.gz | awk '{print $1}')
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "{\"version\":\"${VERSION}\",\"sha256\":\"${SHA}\"}" > apps/desktop/dist/latest.json
          echo "Generated latest.json: version=${VERSION}, sha256=${SHA}"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
            apps/desktop/dist/app.asar.gz apps/desktop/dist/latest.json

  publish:
    needs: [validate, validate-native, build-native, build-native-windows, build-asar]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
