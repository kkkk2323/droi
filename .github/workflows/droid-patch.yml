name: Patched Droid recipes

# Makes the recipe of the newest droid for each platform Droi patches
# (ADR 0027), verifies the patched build against a local receiver, signs the
# recipes and publishes them to the droid-patch release, where Droi reads
# them. A droid the patch no longer fits fails the run and opens an issue.

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'droid version (the latest when empty)'
        required: false

concurrency:
  group: droid-patch
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  RELEASE_TAG: droid-patch
  VERSION: ${{ inputs.version }}

jobs:
  # One platform after another: each adds its build to the recipes the
  # last one wrote.
  darwin-arm64:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/native/go.mod
      - name: Published recipes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          # Before the first release, the recipes Droi embeds.
          gh release download "$RELEASE_TAG" -p recipes.json -D published || cp apps/native/pkg/droidpatch/recipes.json published/recipes.json
      - name: Patch and verify
        run: go run ./apps/native/pkg/droidpatch/cmd/droidpatch update ${VERSION:+-version "$VERSION"} -recipes published/recipes.json -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: recipes-arm64
          path: |
            dist/recipes.json
            published/recipes.json

  darwin-amd64:
    needs: darwin-arm64
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/native/go.mod
      - uses: actions/download-artifact@v4
        with:
          name: recipes-arm64
      - name: Patch, verify and sign
        env:
          DROI_RECIPE_SIGNING_KEY: ${{ secrets.DROI_RECIPE_SIGNING_KEY }}
        run: |
          test -n "$DROI_RECIPE_SIGNING_KEY" || { echo "DROI_RECIPE_SIGNING_KEY is not set"; exit 1; }
          mv dist/recipes.json arm64.json
          go run ./apps/native/pkg/droidpatch/cmd/droidpatch update ${VERSION:+-version "$VERSION"} -recipes arm64.json -out dist
      - uses: actions/upload-artifact@v4
        with:
          name: recipes
          path: |
            dist/recipes.json
            dist/recipes.json.sig
            published/recipes.json

  publish:
    needs: darwin-amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: recipes
      - name: Publish when changed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if cmp -s dist/recipes.json published/recipes.json; then
            echo "The recipes did not change."
            exit 0
          fi
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --prerelease \
            --title "Patched Droid recipes" \
            --notes "The recipes Droi patches droid with (ADR 0027). Written by the Patched Droid recipes workflow; not an app release."
          gh release upload "$RELEASE_TAG" dist/recipes.json dist/recipes.json.sig --clobber

  report:
    needs: [darwin-arm64, darwin-amd64, publish]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Patched Droid: the newest droid could not be patched"
          if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
            echo "An issue is open already."
            exit 0
          fi
          gh issue create --title "$title" --label needs-triage --body "The recipes workflow failed: $RUN_URL

          Droi keeps offering the Patched Droid of the last version that has a recipe. Run \`droidpatch update\` by hand (see apps/native/pkg/droidpatch/cmd/droidpatch) to see why the patch no longer fits."
